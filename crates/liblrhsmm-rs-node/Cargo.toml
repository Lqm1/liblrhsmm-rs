[package]
publish = false
name = "liblrhsmm-rs-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Native Node.js bindings for liblrhsmm-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.10.3", default-features = false }
liblrhsmm-rs = { path = "../liblrhsmm-rs", version = "0.1.0-alpha.2", default-features = false }
napi = { version = "3.14", default-features = false, features = ["napi8"] }
napi-derive = "3.6"

[build-dependencies]
napi-build = "2.6"

[features]
default = ["serialization"]
serialization = ["liblrhsmm-rs/serialization"]
